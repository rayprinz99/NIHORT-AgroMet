<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIHORT AgroMet Atmospheric Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="C:\Users\DELL\Desktop\NIHORT_MET RH CALCULATIONS\images.jpeg">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

</head>
<body>

    <div class="container">
        <h1>NIHORT AgroMet Department Psychrometric Calculator</h1>
        <p class="subtitle">Calculate Relative Humidity, Vapour Pressure and Dew Point from Temperature Data.</p>
        
        <div class="input-section">
            <div class="field">
                <label for="dry">Dry Bulb Temp (°C)</label>
                <input type="number" id="dry" placeholder="e.g. 25" step="0.1">
            </div>
            <div class="field">
                <label for="wet">Wet Bulb Temp (°C)</label>
                <input type="number" id="wet" placeholder="e.g. 18" step="0.1">
            </div>
            <button id="calcBtn">Calculate Results</button>
        </div>

        <div id="resultsBoard" class="results-hidden">
            <div class="card">
                <small>Vapour Pressure</small>
                <h2 id="resVP">--</h2>
                <span>hPa</span>
            </div>
            <div class="card highlight">
                <small>Relative Humidity</small>
                <h2 id="resRH">--</h2>
                <span>%</span>
            </div>
            <div class="card">
                <small>Dew Point</small>
                <h2 id="resDP">--</h2>
                <span>°C</span>
            </div>
        </div>
    
        <footer>
            <p>
                Developed by <span>RAHEEM, Ismail Oyelakin</span></p>
            <p><span>NIHORT AgroMet Department, Ibadan</span></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
