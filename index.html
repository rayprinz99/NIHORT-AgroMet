<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIHORT AgroMet Atmospheric Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./images.jpeg">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>

    <div class="container">
        <div class="logo-header">
            <img src="images.jpeg" alt="NIHORT Logo">
        </div>
        
        <h1>AgroMet Psychrometric Calculator</h1>
        <p class="subtitle">NIHORT AgroMet Department, Ibadan</p>
        
        <div class="input-section">
            <div class="field">
                <label for="td">Dry Bulb Temp (°C)</label>
                <input type="number" id="td" placeholder="e.g 34.0" step="0.1">
            </div>
            <div class="field">
                <label for="tw">Wet Bulb Temp (°C)</label>
                <input type="number" id="tw" placeholder="e.g 30.0" step="0.1">
            </div>
            <div class="button-group">
                <button id="calcBtn">Calculate</button>
                <button id="clearBtn" class="secondary-btn">Clear Log</button>
            </div>
        </div>

        <div id="resultsBoard" class="results-hidden">
            <div class="card">
                <small>Vapour Pressure</small>
                <h2 id="resVP">--</h2>
                <span>hPa</span>
            </div>
            <div class="card highlight">
                <small>Rel. Humidity</small>
                <h2 id="resRH">--</h2>
                <span>%</span>
            </div>
            <div class="card">
                <small>Dew Point</small>
                <h2 id="resDP">--</h2>
                <span>°C</span>
            </div>
        </div>

        <button id="installBtn" style="display:none;">Install NIHORT App</button>
    
        <footer>
            <p>Developed by <span>RAHEEM, Ismail Oyelakin</span></p>
            <p>&copy; <span id="year"></span> | NIHORT AgroMet Dept.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
